apiVersion: apps/v1
kind: Deployment
metadata:
  name: photosync-backend
  labels:
    app.kubernetes.io/name: photosync
    app.kubernetes.io/component: backend
spec:
  # Single replica + Recreate: state is SQLite on one RWO volume. Do not scale
  # this out — two pods writing the same SQLite file will corrupt it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: photosync
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photosync
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/aussietin/photosync-backend:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATA_DIR
              value: /data
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: photosync
                  key: API_TOKEN
            # If /data is NFS-backed, keep SQLite off the share (see
            # nfs-pv.example.yaml):
            # - name: DATABASE_URL
            #   value: sqlite+aiosqlite:////dblocal/photosync.db
          volumeMounts:
            - name: data
              mountPath: /data
            # Existing photo library on the NAS, read-only, for in-place
            # folder import (Import view → path /library):
            # - name: library
            #   mountPath: /library
            #   readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Thumbnailing large HEICs is memory-spiky; CLIP/face models
              # (if you install the AI extras) need ~2Gi+. Raise as needed.
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: photosync-data
        # - name: library
        #   nfs:
        #     server: 192.168.1.10
        #     path: /volume1/photos
        #     readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: photosync-backend
  labels:
    app.kubernetes.io/name: photosync
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: photosync
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
