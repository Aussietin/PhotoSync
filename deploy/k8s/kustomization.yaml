apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: photosync

resources:
  - namespace.yaml
  - pvc.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  # Create the API token secret first (see secret.example.yaml), or copy that
  # file to secret.yaml with a real token and list it here:
  # - secret.yaml
  # Optional direct-NFS PersistentVolume (edit server/path first):
  # - nfs-pv.example.yaml

# Pin images to a release instead of `latest` by uncommenting:
# images:
#   - name: ghcr.io/aussietin/photosync-backend
#     newTag: v1.0.0
#   - name: ghcr.io/aussietin/photosync-frontend
#     newTag: v1.0.0
