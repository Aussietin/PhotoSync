# Copy to secret.yaml (git-ignored) and set a real token, or create it
# directly without a file:
#
#   kubectl create secret generic photosync -n photosync \
#     --from-literal=API_TOKEN=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
#
# The token is required: the backend serves photos to anyone who can reach it
# otherwise. Paste the same token into the UI when prompted.
apiVersion: v1
kind: Secret
metadata:
  name: photosync
type: Opaque
stringData:
  API_TOKEN: change-me-to-a-long-random-secret
